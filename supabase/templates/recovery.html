<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetowanie hasła</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 20px; border-radius: 8px;">
        <h2 style="color: #2563eb; margin-bottom: 20px;">Resetowanie hasła</h2>
        
        <p style="margin-bottom: 20px;">
            Otrzymałeś ten email, ponieważ zostało wysłane żądanie zresetowania hasła dla Twojego konta.
        </p>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="http://localhost:3000/auth/reset-password?token_hash={{ .TokenHash }}&type=recovery" 
               style="background-color: #2563eb; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block; font-weight: bold;">
                Zresetuj hasło
            </a>
        </div>
        
        <p style="font-size: 14px; color: #666; margin-top: 30px;">
            Jeśli nie wysyłałeś żądania zresetowania hasła, zignoruj ten email.
        </p>
    </div>
</body>
</html>
